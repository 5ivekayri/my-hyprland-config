wallpaper {
    monitor = eDP-1
    path = ~/.wallpapers/thunderstorm-sea.webp
    fit_mode = cover
}

# Use the same wallpaper on the external HDMI display.  The display profile
# script decides which output is enabled.
wallpaper {
    monitor = HDMI-A-1
    path = ~/.wallpapers/thunderstorm-sea.webp
    fit_mode = cover
}

splash = false
