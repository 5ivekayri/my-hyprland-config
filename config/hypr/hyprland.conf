# See https://wiki.hyprland.org/Configuring/Monitors/
# Keep monitor layout in one generated/profile file to avoid conflicting rules.
source = ~/.config/hypr/monitors.conf

# Keep XWayland clients (including Steam) sharp on the 125% display.
# They render at native pixel density instead of being compositor-upscaled.
xwayland {
    force_zero_scaling = true
}

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

exec-once = hyprpaper
exec-once = swaync
exec-once = ~/.config/hypr/scripts/Polkit.sh
# A lock inside the script prevents duplicate hot-plug watchers on reload.
exec = ~/.config/hypr/scripts/external-monitor-profile.sh auto
exec-once = waybar
# Required by xdg-desktop-portal (Discord/Wayland screen sharing).
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# This Hyprland session is not launched as a systemd graphical session, so
# the portal's Requisite=graphical-session.target needs an explicit bypass.
exec-once = systemctl --user start xdg-desktop-portal.service --job-mode=ignore-dependencies

# Some default env vars.
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that 
env = WLR_DRM_NO_ATOMIC,1 # some nvidia fix
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
  kb_layout = us,ru
  kb_variant =
  kb_model =
  kb_options = grp:alt_shift_toggle
  kb_rules =

  follow_mouse = 1

  touchpad {
    natural_scroll = no
  }

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more

  gaps_in = 5
  gaps_out = 10

  border_size = 2
  col.active_border = rgba(6e8a91ee) rgba(a6afabee) 45deg
  col.inactive_border = rgba(1e3b44aa)

  # layout = dwindle
  layout = master

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false
}

decoration {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more

  rounding = 10
  
  blur {
    enabled = true
    size = 8
    passes = 3
    vibrancy = 0.18
  }

  shadow {
    enabled = false
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }
}

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.20, match:namespace waybar

animations {
  enabled = yes

  bezier = defaultBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 7, defaultBezier
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, defaultBezier
}

dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  # Pseudotiling was removed from recent Hyprland versions.
  preserve_split = yes # you probably want this
}

master {
  # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
  new_status = master
  mfact = 0.5
}

misc {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
